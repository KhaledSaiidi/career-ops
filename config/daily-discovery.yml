# Planned input for the daily-discovery controller in plan.md Phase 5.
# Current Career-Ops scanners do not consume this file yet.

timezone: "Africa/Tunis"
daily_time: "18:00"

target:
  minimum_qualified_jobs: 5
  preferred_qualified_jobs_min: 10
  preferred_qualified_jobs_max: 15
  match_score_threshold: 75

evaluation:
  # Uses `codex exec` with this laptop's saved ChatGPT login; no API key.
  backend: "codex-cli"

country_effort:
  Netherlands: 35
  France: 25
  Belgium: 10
  Denmark: 10
  Luxembourg: 10
  Sweden: 10

discovery:
  initial_posting_age_days: 7
  expanded_posting_age_days: 30
  maximum_posting_age_days: 90
  require_confirmed_eligibility_blocker_exclusion: true
  allow_unknown_sponsorship_when_no_blocker: true
  # Enabled only after read-only schema/auth validation. A write still requires
  # the explicit --write-sheet flag and the append-only export ledger.
  write_google_sheet: true
  # Adapter selection is explicit; all runs retain source/country provenance.
  country_source_coverage:
    Netherlands: ["Welcome to the Jungle — Netherlands", "Adyen official Greenhouse"]
    France: ["Welcome to the Jungle — France"]
    Belgium: ["Welcome to the Jungle — Belgium", "VDAB"]
    Denmark: ["The Hub — Denmark"]
    Luxembourg: ["Welcome to the Jungle — Luxembourg", "SES official SuccessFactors"]
    Sweden: ["The Hub — Sweden"]

  # Source inventory. `active` entries are backed by a configured Career-Ops
  # provider in portals.yml; `pending_adapter` entries are intentionally not
  # presented as discovery coverage until a compliant, tested connector exists.
  source_inventory:
    - name: "The Hub — Denmark"
      countries: [Denmark]
      status: active
      configured_as: "portals.yml: The Hub — Denmark (provider: thehub)"
    - name: "Welcome to the Jungle"
      countries: [Netherlands, France, Belgium, Luxembourg]
      status: active
      configured_as: "portals.yml: country-specific WTTJ entries (provider: wttj)"
    - name: "Apec"
      countries: [France]
      status: pending_adapter
      url: "https://www.apec.fr/candidat/recherche-emploi.html"
      constraint: "Public retrieval returned Apec/DataDome 403 on 2026-10-30; enable only with an official permitted feed or approved API access. France Travail is not an Apec substitute."
    - name: "LesJeudis"
      countries: [France]
      status: pending_adapter
      url: "https://lesjeudis.com/jobs"
      constraint: "Public retrieval returned Cloudflare 403 on 2026-10-30; enable only with a permitted public feed, never by bypassing bot controls."
    - name: "IamExpat Jobs"
      countries: [Netherlands]
      status: pending_adapter
      url: "https://www.iamexpat.nl/career/jobs-netherlands"
      constraint: "Public listing route is reachable; requires a tested read-only Career-Ops adapter and employer-application URL extraction before enabling."
    - name: "DutchNews Jobs"
      countries: [Netherlands]
      status: pending_adapter
      url: "https://www.nederlandpost.nl/jobs"
      constraint: "Powered by IamExpat; share a deduplication identity with IamExpat if an adapter is added."
    - name: "Undutchables"
      countries: [Netherlands]
      status: pending_adapter
      url: "https://www.undutchables.nl/jobs"
      constraint: "Public retrieval returned Cloudflare 403 on 2026-10-30; enable only with a permitted public feed. Agency roles also require official vacancy URLs and employer-identity verification."
    - name: "GraduateLand"
      countries: [Denmark, Sweden]
      status: pending_adapter
      url: "https://graduateland.com/jobs"
      constraint: "Redirects to JobTeaser, whose public route returned a Cloudflare challenge on 2026-10-30; graduate-focused roles remain subject to the existing Graduate exclusion."

# The credential path remains an environment variable, never committed.
sheets:
  spreadsheet_id: "1FHJcYOm2nq7MHegIuE0_xsQN9BP0B2SpZCUz06iZfqU"
  tab: "Recommended Jobs"
  service_account_credentials_env: "GOOGLE_APPLICATION_CREDENTIALS"
