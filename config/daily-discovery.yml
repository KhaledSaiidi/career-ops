# Planned input for the daily-discovery controller in plan.md Phase 5.
# Current Career-Ops scanners do not consume this file yet.

timezone: "Africa/Tunis"
daily_time: "18:00"

target:
  minimum_qualified_jobs: 5
  preferred_qualified_jobs_min: 10
  preferred_qualified_jobs_max: 15
  match_score_threshold: 75

evaluation:
  # Uses `codex exec` with this laptop's saved ChatGPT login; no API key.
  backend: "codex-cli"

country_effort:
  Netherlands: 35
  France: 25
  Belgium: 10
  Denmark: 10
  Luxembourg: 10
  Sweden: 10

discovery:
  initial_posting_age_days: 7
  expanded_posting_age_days: 30
  maximum_posting_age_days: 90
  require_confirmed_eligibility_blocker_exclusion: true
  allow_unknown_sponsorship_when_no_blocker: true
  write_google_sheet: false
  # Adapter selection is explicit; all runs retain source/country provenance.
  country_source_coverage:
    Netherlands: ["Welcome to the Jungle — Netherlands", "Adyen official Greenhouse"]
    France: ["Welcome to the Jungle — France"]
    Belgium: ["Welcome to the Jungle — Belgium", "VDAB"]
    Denmark: ["The Hub — Denmark"]
    Luxembourg: ["Welcome to the Jungle — Luxembourg", "SES official SuccessFactors"]
    Sweden: ["The Hub — Sweden"]

# The credential path remains an environment variable, never committed.
sheets:
  spreadsheet_id: "1FHJcYOm2nq7MHegIuE0_xsQN9BP0B2SpZCUz06iZfqU"
  tab: "Recommended Jobs"
  service_account_credentials_env: "GOOGLE_APPLICATION_CREDENTIALS"
